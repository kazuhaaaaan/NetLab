    <path d="M-120,300 Q-96,285 -72,300" stroke="#7f1d1d" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M72,300 Q96,285 120,300" stroke="#7f1d1d" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>

