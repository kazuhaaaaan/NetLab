<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#4a1522"/>
      <stop offset="45%" stop-color="#2b0a12"/>
      <stop offset="100%" stop-color="#120308"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde9c8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f5cba7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5cba7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1119"/>
      <stop offset="100%" stop-color="#1c080d"/>
    </linearGradient>
    <linearGradient id="hatDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c161c"/>
      <stop offset="100%" stop-color="#180b10"/>
    </linearGradient>
    <radialGradient id="skin" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe9d6"/>
      <stop offset="100%" stop-color="#f7c9a8"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Langit malam -->
