    <rect x="162" y="196" width="56" height="6" fill="#dc2626"/>
    <ellipse cx="190" cy="166" rx="16" ry="10" fill="#fff7ed" opacity="0.9"/>
    <ellipse cx="190" cy="164" rx="8" ry="12" fill="#f97316"/>
    <ellipse cx="188" cy="160" rx="3.5" ry="6" fill="#fde68a"/>
    <rect x="162" y="218" width="56" height="8" rx="4" fill="#7f1d1d"/>
